name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt every javascript action into Node 24 ahead of the June 2 2026
# forced migration. Without this, GitHub decorates every run with a
# yellow deprecation banner that reads like a failure even when the
# job is green.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The layout tier renders the class layer in real Chromium and measures
      # it, because every other tier here runs in jsdom, which does not lay out.
      # Installed explicitly rather than via a postinstall hook so the step is
      # visible in the log and cannot be silently skipped by an install policy.
      - name: Install Chromium for the layout tier
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      # test:all is the whole gate: package tests, cross-consumer parity,
      # migration-guide staleness, the contrast check, and the browser layout
      # check. CI used to run only `test` and `test:parity`, which is how the
      # staleness check was able to rot to sixteen failures without anyone
      # finding out -- a check that nothing runs is not a check.
      - run: pnpm test:all
      # The scripts under scripts/ are build and release tooling, and their
      # tests live outside the per-package suites that `pnpm -r test` reaches.
      - name: Repository tooling tests
        run: pnpm test:scripts
