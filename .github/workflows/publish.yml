name: Publish

on:
  push:
    branches: [main]

# Opt every javascript action into Node 24 ahead of the June 2 2026
# forced migration. Removes the deprecation banner from every run.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      # Do NOT set registry-url: it creates .npmrc with _authToken=${NODE_AUTH_TOKEN}
      # that blocks OIDC trusted publishing. Registry is in the project .npmrc.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `pnpm test:all` has an ENVIRONMENT PRECONDITION, not just a dependency
      # list: two of its tiers drive real Chromium. Any workflow that calls it
      # must install the browser first.
      #
      # This step was missing here while ci.yml had it, and the consequence was
      # that EVERY publish failed from the moment the layout tier joined
      # test:all. Two releases' worth: 0.33.0 was the last version to reach npm,
      # while main sat at 0.34.0 with a green CI run beside a red Publish run on
      # the same commit. A downstream consumer's `make sync-strand` pulls from
      # npm, so the primitive existed, was tested, was documented, was pushed,
      # and could not be consumed by anybody.
      #
      # Installed explicitly rather than via a postinstall hook so the step is
      # visible in the log and cannot be silently skipped by an install policy.
      # Same command and same reasoning as ci.yml; if one changes, change both.
      - name: Install Chromium for the browser tiers
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build

      # Everything below this line publishes to npm, which cannot be undone.
      # test:all covers package tests, cross-consumer parity (the lockstep
      # gate), migration-guide staleness, the contrast check, and the two
      # browser tiers: layout (does the rendered box have the right geometry)
      # and motion (did anything actually animate, and within the rules). So a
      # release cannot ship text below its WCAG threshold, a guide that names a
      # class the build no longer produces, a region that fails to hold its
      # box, or a state change that cuts instead of settling.
      - run: pnpm test:all

      - name: Repository tooling tests
        run: pnpm test:scripts

      - name: Publish @dillingerstaffing/strand
        working-directory: packages/tokens
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view @dillingerstaffing/strand version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            npm publish --access public
          else
            echo "Skipped @dillingerstaffing/strand@$LOCAL (already published)"
          fi

      - name: Publish @dillingerstaffing/strand-ui
        run: |
          LOCAL=$(node -p "require('./packages/strand-ui/package.json').version")
          REMOTE=$(npm view @dillingerstaffing/strand-ui version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            # Resolve workspace:^ to actual version before npm publish
            TOKENS_VERSION=$(node -p "require('./packages/tokens/package.json').version")
            cd packages/strand-ui
            node -e "
              const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
              pkg.dependencies['@dillingerstaffing/strand'] = '^${TOKENS_VERSION}';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public
          else
            echo "Skipped @dillingerstaffing/strand-ui@$LOCAL (already published)"
          fi

      - name: Publish @dillingerstaffing/strand-vue
        run: |
          LOCAL=$(node -p "require('./packages/strand-vue/package.json').version")
          REMOTE=$(npm view @dillingerstaffing/strand-vue version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            TOKENS_VERSION=$(node -p "require('./packages/tokens/package.json').version")
            cd packages/strand-vue
            node -e "
              const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
              pkg.dependencies['@dillingerstaffing/strand'] = '^${TOKENS_VERSION}';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public
          else
            echo "Skipped @dillingerstaffing/strand-vue@$LOCAL (already published)"
          fi

      - name: Publish @dillingerstaffing/strand-svelte
        run: |
          LOCAL=$(node -p "require('./packages/strand-svelte/package.json').version")
          REMOTE=$(npm view @dillingerstaffing/strand-svelte version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            TOKENS_VERSION=$(node -p "require('./packages/tokens/package.json').version")
            cd packages/strand-svelte
            node -e "
              const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
              pkg.dependencies['@dillingerstaffing/strand'] = '^${TOKENS_VERSION}';
              require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            npm publish --access public
          else
            echo "Skipped @dillingerstaffing/strand-svelte@$LOCAL (already published)"
          fi

      - name: Publish strand-ui (CLI)
        working-directory: packages/cli
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view strand-ui version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL" != "$REMOTE" ]; then
            npm publish --access public
          else
            echo "Skipped strand-ui@$LOCAL (already published)"
          fi

      # The tag and the release key off the version itself, never off "did the
      # last commit touch package.json": a push that carries the release commit
      # plus fixes on top of it publishes to npm (those steps compare against
      # the registry) but its HEAD~1..HEAD diff shows no bump, and 0.63.0 shipped
      # to npm with no tag and no release that way. Idempotent: an existing tag
      # or release is left alone.
      - name: Tag release version
        run: |
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists"
          else
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Create release for the version
        run: |
          VERSION=$(node -p "
            const fs = require('fs');
            const versions = ['packages/tokens','packages/strand-ui','packages/strand-vue','packages/strand-svelte','packages/cli']
              .map(d => JSON.parse(fs.readFileSync(d+'/package.json')).version);
            versions.sort((a,b) => b.localeCompare(a, undefined, {numeric:true}));
            versions[0];
          ")
          if gh release view "v${VERSION}" --json tagName >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping create"
          else
            gh release create "v${VERSION}" --title "v${VERSION}" --generate-notes --target main
            echo "Created release v${VERSION}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
